name: SITL Cygwin builds

on:
  schedule:
    # Catch up gradually; each Windows SITL build is expensive.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_builds:
        description: "Max missing tags to build in this run"
        required: false
        default: "2"
        type: string
      only_tag:
        description: "Optional single upstream tag (e.g. Plane-4.5.7)"
        required: false
        default: ""
        type: string

concurrency:
  group: sitl-cygwin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover missing tags
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.discover.outputs.should_build }}
      tags: ${{ steps.discover.outputs.tags }}
      missing_count: ${{ steps.discover.outputs.missing_count }}
    steps:
      - name: Checkout VGCS-SITL
        uses: actions/checkout@v5

      - name: Discover tags ≥ 4.5.0 not yet released here
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover_missing_tags.py \
            --repo "${{ github.repository }}" \
            --max-builds "${{ github.event.inputs.max_builds || '2' }}" \
            --only-tag "${{ github.event.inputs.only_tag || '' }}"

  build:
    name: Build batch (Cygwin once)
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout VGCS-SITL scripts
        uses: actions/checkout@v5
        with:
          path: vgcs-sitl

      - name: Restore Cygwin cache
        id: cache-cygwin
        uses: actions/cache@v5
        with:
          path: |
            C:\cygwin
            C:\cygwin-packages
          key: cygwin-x86_64-py39-${{ hashFiles('vgcs-sitl/.github/cygwin-packages.txt') }}

      - name: Restore compiler ccache
        uses: actions/cache@v5
        with:
          path: C:\ccache-sitl
          key: ccache-sitl-${{ github.run_id }}
          restore-keys: |
            ccache-sitl-

      - name: Install Cygwin toolchain
        if: steps.cache-cygwin.outputs.cache-hit != 'true'
        uses: cygwin/cygwin-install-action@v6
        with:
          work-vol: "C:"
          install-dir: "C:\\cygwin"
          packages: cygwin64 gcc-g++=13.4.0-1 ccache python39 python39-pip git procps gettext
          add-to-path: false

      - name: Verify Cygwin from cache
        if: steps.cache-cygwin.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\cygwin\bin\bash.exe")) {
            throw "Cygwin cache restore failed (bash.exe missing)."
          }
          Write-Host "Cygwin cache hit — skipping package download/install."

      - name: Prepare Python 3.9 / ccache wrappers
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          ls -la /usr/bin/python3* &&
          /usr/bin/python3.9 -c "import sys, imp; print(sys.version); print('imp OK')" &&
          ln -sf /usr/bin/python3.9 /usr/bin/python3 &&
          python3 -c "import sys; print(sys.version)" &&
          python3 -m pip install --progress-bar off
          'empy==3.3.4' pexpect future lxml pyserial &&
          python3 -m pip install --progress-bar off dronecan --upgrade &&
          mkdir -p /usr/local/bin &&
          cp /usr/bin/ccache /usr/local/bin/ &&
          cd /usr/local/bin &&
          ln -sf ccache gcc &&
          ln -sf ccache g++ &&
          ln -sf ccache x86_64-pc-cygwin-gcc &&
          ln -sf ccache x86_64-pc-cygwin-g++

      - name: Build and publish batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vgcs-sitl\scripts\run_batch.ps1" `
            -TagsJson '${{ needs.discover.outputs.tags }}' `
            -Workspace "$env:GITHUB_WORKSPACE" `
            -Repo "${{ github.repository }}"
